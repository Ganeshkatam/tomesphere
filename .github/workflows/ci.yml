name: Security & CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Security Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Security & Boundary Tests
        run: npm test
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET || 'ci-test-admin-secret-key-12345' }}

      - name: Execute Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.tomesphere.in
